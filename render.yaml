# Render Blueprint — GitHub 저장소를 연결하면 이 파일대로 웹 서비스를 만든다.
# 자세한 순서와 환경변수 설명은 DEPLOY.md 를 보세요.
#
# · 비밀값(API 키, 메일 비밀번호, 소셜 로그인 키)은 여기에 적지 않는다 → sync: false
#   (처음 Blueprint 를 만들 때 Render 화면에서 입력, 나중에는 서비스 > Environment 에서 수정)
# · NODE_ENV 는 넣지 않는다 — production 이면 npm ci 가 빌드 도구(vite)를 설치하지 않아 빌드가 실패한다.
#   운영 모드는 npm start(--prod)로 켜진다.

services:
  - type: web
    name: refboard
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # SQLite 데이터와 올린 이미지(/var/data/uploads)가 재배포 후에도 남도록 영구 디스크에 저장
    # 용량은 늘릴 수만 있고 줄일 수는 없어요 — 늘리는 방법은 DEPLOY.md '5-A'
    disk:
      name: refboard-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      # ── 실행 환경 (값 고정) ──
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"

      # ── 올린 이미지 저장소 ──
      # disk = 위 영구 디스크(/var/data/uploads). 나중에 Cloudflare R2 · AWS S3 로 옮기려면
      # Environment 탭에서 STORAGE_DRIVER=s3 와 S3_BUCKET · S3_ENDPOINT · S3_REGION · S3_ACCESS_KEY_ID · S3_SECRET_ACCESS_KEY 를
      # 넣고 npm run storage:migrate (DEPLOY.md '5-B'). 키 값은 이 파일에 적지 않는다.
      - key: STORAGE_DRIVER
        value: disk
      # 팀별 저장 공간(GB) — 디스크 용량을 늘리면 함께 올리세요
      - key: TEAM_STORAGE_LIMIT_GB
        value: "5"

      # ── 공개 주소 (선택: 비우면 https://<서비스이름>.onrender.com 을 자동 사용) ──
      - key: APP_URL
        sync: false

      # ── AI (Claude) ──
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── 메일 발송 (가입 인증 · 비밀번호 재설정 · 초대 · 의견 보내기) ──
      # 포트는 기본 587. 465(네이버 등)를 쓰면 Environment 에 SMTP_PORT=465 를 추가
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

      # ── 소셜 로그인 (선택) ──
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false

      # ── 의견 보내기 · 관리자 ──
      - key: FEEDBACK_EMAIL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
